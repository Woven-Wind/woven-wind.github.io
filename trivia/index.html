<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivia Topics</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f8ff;
        }

        .header-oval {
            background-color: #9ed3fb;
            width: 100%;
            height: 150px;
            border-radius: 0 0 50% 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .logo {
            font-size: 2.5em;
            color: #00796b;
            font-weight: bold;
            margin-top: 20px;
        }

        .topic-oval {
            background-color: #7394C5;
            border-radius: 50px;
            padding: 15px 40px;
            margin: 30px auto;
            width: fit-content;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .pick-topic {
            text-align: center;
            color: white;
            font-size: 1.5em;
            margin: 0;
        }


        .button-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        img {
            width: 300px;
        }

        .topic-btn {
            padding: 25px 30px;
            background-color: white;
            color: black;
            border-width: 1px;
            border-color: #7394C5;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1.2em;
            transition: background-color 0.3s, transform 0.2s;
            width: 100%;
            min-height: 80px;
        }

        /* Make the last button span both columns */
        .button-container button:last-child {
            grid-column: 1 / -1;
            max-width: 400px;
            margin: 0 auto;
        }

        .topic-btn:hover {
            background-color: #7394C5;
            color: white;
            transform: scale(1.05);
        }

        .topic-btn:active {
            transform: scale(0.95);
        }

        @media (max-width: 600px) {
            .button-container {
                grid-template-columns: 1fr;
            }
            
            .button-container button:last-child {
                grid-column: 1;
                max-width: 100%;
            }
            
            .topic-btn {
                min-height: 60px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="header-oval">
        <div class="logo"><img src="/images/wovenwindlogo.png" /></div>
    </div>
    <div class="topic-oval">
        <h2 class="pick-topic">Pick a topic</h2>
    </div>
    <div class="button-container">
        <button class="topic-btn" data-topic="sustainability">Sustainability</button>
        <button class="topic-btn" data-topic="energy">Energy</button>
        <button class="topic-btn" data-topic="wind-turbines">Wind Turbines</button>
        <button class="topic-btn" data-topic="engineering">Engineering</button>
        <button class="topic-btn" data-topic="random">Random</button>
    </div>

    <script>
        document.querySelectorAll('.topic-btn').forEach(button => {
            button.addEventListener('click', function() {
                const topic = this.dataset.topic;
                window.location.href = `/trivia/${topic}/`;
            });
        });
    </script>
</body>
</html>
